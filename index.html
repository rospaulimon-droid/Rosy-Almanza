<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosy Almanza Limón</title>
<meta name="description" content="Contacto de Rosy Almanza Limón.">
<style>
  :root { --bg:#f6f3ee; --card:#ffffff; --text:#1f2a37; --muted:#5b6672; --accent:#b4572f; --accent-dark:#8f431f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); max-width:440px; width:100%; border-radius:20px; padding:44px 28px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  .avatar { width:104px; height:104px; border-radius:50%; background:var(--accent); color:#fff; font-size:40px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
  h1 { margin:0 0 6px; font-size:28px; font-family: Georgia, serif; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .btn { display:block; text-decoration:none; padding:14px 18px; border-radius:12px; margin-top:12px; font-weight:bold; }
  .primary { background:var(--accent); color:#fff; }
  .primary:hover { background:var(--accent-dark); }
  .secondary { border:2px solid var(--accent); color:var(--accent); }
  .secondary:hover { background:var(--accent); color:#fff; }
  .phone { margin-top:24px; color:var(--muted); font-size:15px; }
  .phone a { color:var(--text); font-weight:bold; text-decoration:none; }
  footer { margin-top:26px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">RA</div>
    <h1>Rosy Almanza Limón</h1>
    <p class="sub">Querétaro, México</p>

    <a class="btn primary" href="https://wa.me/524421213000?text=Hola%20Rosy%2C%20me%20gustar%C3%ADa%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener">Escribir por WhatsApp</a>
    <a class="btn secondary" href="tel:+524421213000">Llamar ahora</a>

    <p class="phone">Teléfono: <a href="tel:+524421213000">442 121 3000</a></p>
    <footer>© Rosy Almanza Limón</footer>
  </main>
</body>
</html>
